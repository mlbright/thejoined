name: Publish to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize runs (no cancel-in-progress) so two quick merges cannot
# publish `latest` out of order.
concurrency:
  group: publish-ghcr-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe` in the Makefile produces
          # the same image tag as a local build.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        # GHCR namespaces must be lowercase; the repo owner may not be
        # (e.g. cPacketNetworks).
        run: make publish-ghcr GHCR_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
